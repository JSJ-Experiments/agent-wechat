name: Fork native migration acceptance
on:
  workflow_dispatch:
  push:
    branches: [experiment/official-account-rss]
    paths:
      - .github/workflows/fork-native-migration.yml
      - packages/native-client-rust/**
      - scripts/smoke/simulator.mjs
permissions:
  contents: read
concurrency:
  group: fork-native-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-arm64:
    if: github.repository == 'JSJ-Experiments/agent-wechat'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: packages/native-client-rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-client-rust -> target
          key: fork-native-migration-arm64-v1
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ffmpeg
      - name: Build native daemon and synthetic upstream
        run: cargo build --locked --profile test -p wx-native -p wechat-simulator --bins
      - name: Verify CLI and synthetic message/media exchange
        run: |
          python3 scripts/smoke.py target/debug/wx
          node ../../scripts/smoke/simulator.mjs
      - name: Verify unknown message and command handling
        run: cargo test --locked -p wechat-core own_account_updates_unknown_commands_and_unsupported_messages_are_skipped_as_handled
